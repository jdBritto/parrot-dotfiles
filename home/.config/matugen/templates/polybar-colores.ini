; ! Lo genera matugen a partir del fondo. No editar aqui:
; ! edita ~/.config/matugen/templates/polybar-colores.ini
[theme]
bg     = #E6{{colors.surface.default.hex_stripped}}
bg-alt = #FF{{colors.surface_container_high.default.hex_stripped}}
fg     = {{colors.on_surface.default.hex}}
muted  = {{colors.outline.default.hex}}
accent = {{colors.primary.default.hex}}
second = {{colors.secondary.default.hex}}
third  = {{colors.tertiary.default.hex}}
border = #80{{colors.primary.default.hex_stripped}}
green  = #1BBF3E
red    = #E5534B
yellow = #F2CC60
orange = #F0883E
