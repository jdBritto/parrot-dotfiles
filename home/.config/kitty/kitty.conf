# Ajustes de Kitty (sirven en BSPWM y en Niri).
# Los colores los genera DMS/matugen a partir del fondo (dank-theme.conf).
# Se recargan solos al cambiar el fondo con "fondo" (BSPWM) o con DMS (Niri).
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# ---- fuente
font_family      JetBrainsMono Nerd Font Mono
font_size        8.0
disable_ligatures cursor

# ---- ventana
window_padding_width  14
background_opacity    0.90
confirm_os_window_close 0
enable_audio_bell     no

# ---- cursor
cursor_shape               beam
cursor_trail               3
cursor_trail_decay         0.1 0.3

# ---- pestañas
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

# ---- rendimiento (VM con virgl)
repaint_delay  8
input_delay    2
sync_to_monitor yes

# ---- atajos
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

# ---- colores del fondo (DMS / matugen). Van al final para ganar.
include dank-tabs.conf
include dank-theme.conf
